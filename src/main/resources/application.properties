spring.application.name=FileSystem


spring.datasource.url=jdbc:postgresql://localhost:5432/ArchivingFileSystem_db
spring.datasource.username=postgres
spring.datasource.password=${PASS:2005}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# HikariCP connection pool configuration.
spring.datasource.hikari.pool-name=FileSystemHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.fetch_size=50

logging.level.com.zaxxer.hikari=DEBUG

